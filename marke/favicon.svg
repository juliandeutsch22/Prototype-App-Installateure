<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Senklot">
  <title>Senklot</title>
  <!-- FÜR 16 PIXEL GEZEICHNET, nicht verkleinert: die Schnur wäre dort ein
       Grauschleier. Öse, Schulter und Spitze tragen allein und sitzen
       deshalb grösser; die Fugen sind auf knapp ein Pixel bei 16 px
       verbreitert, sonst liefen die drei Teile zu einem Klecks zusammen. -->
  <rect width="64" height="64" rx="12" fill="#FFFFFF"/>
  <rect x="27.2" y="4" width="9.6" height="7.1" rx="1" fill="#0F4552"/>
  <path d="M23.9 14.6 H40.1 L48.3 25.1 H15.7 Z" fill="#0F4552"/>
  <path d="M15.7 28.6 H48.3 L32 60 Z" fill="#0F4552"/>
</svg>
