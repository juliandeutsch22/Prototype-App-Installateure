<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Senklot">
  <title>Senklot</title>
  <!-- FÜR 16 PIXEL GEZEICHNET, nicht verkleinert: die Schnur wäre dort ein
       Grauschleier. Der Körper trägt allein und sitzt deshalb grösser.

       Auch hier umgekehrt. Bei 16 px ist das der grössere Gewinn als beim
       App-Zeichen: eine dunkle Figur auf hellem Grund bleibt bis zum letzten
       Pixel eine Figur, eine helle auf dunklem läuft an den Kanten zu. -->
  <rect width="64" height="64" rx="12" fill="#FFFFFF"/>
  <path d="M32 6 L44 26 L32 59 L20 26 Z" fill="#0F4552"/>
</svg>
