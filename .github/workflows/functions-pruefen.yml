name: Cloud Functions prüfen

# WARUM ES DIESEN LAUF GIBT.
#
# Die Functions wurden bisher ausschliesslich beim DEPLOY uebersetzt — und der
# laeuft nur auf `main`. Ein Typfehler in einem Handler kam damit erst nach dem
# Merge zum Vorschein, im selben Lauf, der ihn ausliefern sollte.
#
# WARUM NICHT EINFACH IM HOSTING-LAUF MITPRUEFEN. Genau davor warnt der
# Kopfkommentar von `deploy-functions.yml`: was an den Functions haengt, darf
# das Hosting nicht mitreissen. Eine kaputte Abhaengigkeit der Functions wuerde
# sonst eine Auslieferung der Oberflaeche blockieren, die damit nichts zu tun
# hat. Deshalb ein eigener Lauf.
#
# WAS ER PRUEFT, UND WAS NICHT. Er uebersetzt gegen die ECHTEN Firebase-Typen
# aus `functions/node_modules` — die einzige Stelle, an der das geschieht. Das
# VERHALTEN der Handler prueft `tests/functions/` in der Wurzel, mit
# untergeschobenen Ersatzmodulen; und weil dort `tsconfig.json` auf dieselben
# Ersatzmodule zeigt, saehe sie einen Typfehler gegen die echte Schnittstelle
# nicht. Beides zusammen deckt es ab.
#
# KEINE SECRETS, KEIN DEPLOY. Dieser Lauf kann nichts veroeffentlichen.

on:
  pull_request:
    paths:
      - 'functions/**'
      - 'shared/**'
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'shared/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions-pruefen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uebersetzen:
    name: Übersetzen gegen die echten Firebase-Typen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Dieselbe Fassung wie im Deploy (functions/package.json: engines).
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Abhängigkeiten
        working-directory: functions
        run: npm ci

      # Ohne ENABLE_VOICE bleibt `voiceExtract` aussen vor — genau wie im
      # Deploy ohne KI-Erfassung. Geprueft wird also das, was tatsaechlich
      # ausgeliefert wird.
      - name: Übersetzen
        working-directory: functions
        run: npm run build
