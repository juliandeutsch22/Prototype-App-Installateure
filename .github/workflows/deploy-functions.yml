name: Cloud Functions deployen

# Getrennt vom Hosting-Deploy, aus zwei Gründen:
#
#  1. Functions brauchen den Blaze-Tarif und können echte Kosten auslösen.
#     Ein versehentlicher Deploy soll nicht bei jeder Änderung an der
#     Oberfläche mitlaufen.
#  2. voiceExtract hängt an API-Schlüsseln im Secret Manager. Fehlen die,
#     scheitert der Functions-Deploy — im selben Lauf würde er das Hosting
#     mit sich reißen, das damit nichts zu tun hat.
#
# Läuft deshalb nur, wenn sich wirklich etwas an den Functions geändert hat —
# oder von Hand.
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:
    inputs:
      ki_erfassung:
        description: >-
          KI-Spracherfassung mitdeployen? Braucht die beiden API-Schlüssel im
          Secret Manager. Solange die Erfassung in der App abgeschaltet ist,
          hier "false" lassen.
        type: boolean
        default: false

permissions:
  contents: read

# Zwei gleichzeitige Functions-Deploys auf dasselbe Projekt kollidieren.
concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Functions bauen und veröffentlichen
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Zugangsdaten vorhanden?
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT oder VITE_FIREBASE_PROJECT_ID fehlt."
            exit 1
          fi

      - name: Abhängigkeiten
        working-directory: functions
        run: npm ci

      # Übersetzen vor dem Deploy: ein Typfehler soll hier auffallen und
      # nicht erst, wenn die halbe Auslieferung schon gelaufen ist.
      # ENABLE_VOICE entscheidet, ob voiceExtract ueberhaupt exportiert wird
      # (scripts/voice-entry.mjs laeuft als prebuild). Firebase loest
      # `defineSecret` schon beim ANALYSIEREN auf, unabhaengig von `--only` —
      # ein bedingter Deploy allein reicht deshalb nicht, der Export muss weg.
      - name: Übersetzen
        working-directory: functions
        env:
          ENABLE_VOICE: ${{ inputs.ki_erfassung && 'true' || 'false' }}
        run: npm run build

      - name: Dienstkonto bereitstellen
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          chmod 600 "$RUNNER_TEMP/service-account.json"

      # Nur wenn die KI-Erfassung wirklich mit soll. Ohne sie wird
      # voiceExtract gar nicht erst exportiert (siehe functions/src/index.ts),
      # und dann verlangt der Deploy auch keine Schluessel.
      #
      # Vorher stand diese Pruefung unbedingt davor und liess JEDEN
      # Functions-Deploy scheitern — auch den von syncUserClaims, ohne das ein
      # neu angelegter Benutzer keine Berechtigungen bekommt. Ein
      # abgeschaltetes Nebenfeature blockierte damit die wichtigste Function
      # der App.
      - name: Secrets vorhanden?
        if: inputs.ki_erfassung
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          fehlt=""
          for s in ANTHROPIC_API_KEY TRANSCRIPTION_API_KEY; do
            # :get liest nur die Metadaten, nie den Wert — so kann kein
            # Schluessel in dieses Protokoll geraten.
            if ! npx --yes firebase-tools@15 functions:secrets:get "$s" \
                 --project "$PROJECT_ID" >/dev/null 2>&1; then
              fehlt="$fehlt $s"
            fi
          done
          if [ -n "$fehlt" ]; then
            echo "::error::Diese Secrets fehlen oder der Secret Manager ist nicht aktiviert:$fehlt"
            echo ""
            echo "1. Secret Manager API aktivieren:"
            echo "   https://console.cloud.google.com/apis/library/secretmanager.googleapis.com"
            echo "2. Beide Secrets anlegen:"
            echo "   https://console.cloud.google.com/security/secret-manager"
            echo ""
            echo "Oder den Lauf ohne KI-Erfassung starten — dann werden sie nicht gebraucht."
            exit 1
          fi
          echo "Beide Secrets sind hinterlegt."

      # Cloud Scheduler VORAB prüfen.
      #
      # Der nächtliche Lauf der Monatsbilanzen (`bilanzenNachtlauf`) ist eine
      # zeitgesteuerte Function und verlangt cloudscheduler.googleapis.com.
      # Fehlt die API, bricht Firebase MITTEN im Deploy ab — und zwar den
      # ganzen: der Bilanz-Trigger und der Erstaufbau kommen dann ebenfalls
      # nicht durch, obwohl sie mit dem Zeitplan nichts zu tun haben. Genau
      # das ist beim ersten Deploy passiert, mit einer Meldung, die nur im
      # Protokoll steht.
      #
      # Dieselbe Vorabprüfung wie bei den Secrets: lieber vorher klar sagen,
      # was fehlt, als hinterher raten lassen.
      - name: Cloud Scheduler vorhanden?
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          token="$(npx --yes google-auth-library-cli 2>/dev/null || true)"
          # Ueber die Service-Usage-API nachsehen, ob die API aktiv ist.
          zugriff="$(gcloud auth application-default print-access-token 2>/dev/null || true)"
          if [ -z "$zugriff" ]; then
            echo "Zustand liess sich nicht pruefen — der Deploy meldet es sonst selbst."
            exit 0
          fi
          status="$(curl -s -H "Authorization: Bearer $zugriff" \
            "https://serviceusage.googleapis.com/v1/projects/$PROJECT_ID/services/cloudscheduler.googleapis.com" \
            | grep -o '"state": *"[A-Z]*"' | head -1)"
          case "$status" in
            *ENABLED*)
              echo "Cloud Scheduler ist aktiviert."
              ;;
            *)
              echo "::error::Cloud Scheduler ist im Projekt nicht aktiviert."
              echo ""
              echo "Der naechtliche Lauf der Monatsbilanzen braucht diese API."
              echo "Ohne sie scheitert der GESAMTE Functions-Deploy, auch der"
              echo "Bilanz-Trigger und der Erstaufbau."
              echo ""
              echo "Einmalig aktivieren:"
              echo "  https://console.cloud.google.com/apis/library/cloudscheduler.googleapis.com?project=$PROJECT_ID"
              echo ""
              echo "Danach diesen Workflow erneut starten."
              exit 1
              ;;
          esac

      # Aufräumregel für die Container-Abbilder, EINMAL und ausdrücklich.
      #
      # Functions v2 legt für jede Version ein Container-Abbild in der
      # Artifact Registry ab. Ohne Aufräumregel sammeln die sich an und kosten
      # dauerhaft Geld. Der Deploy merkt das und will die Regel selbst
      # anlegen — im Nicht-interaktiven Lauf kann er nicht fragen und bricht
      # ab, MIT bereits erfolgreich veröffentlichten Functions und Exit-Code
      # 1. Der Lauf ist dann rot, obwohl der Deploy geglückt ist.
      #
      # Der von Firebase vorgeschlagene Ausweg wäre `--force` am Deploy. Den
      # gibt es hier bewusst nicht: er würde zugleich Functions, die im Code
      # fehlen, ohne Rückfrage aus der Produktion löschen. Also die Regel
      # vorher separat setzen — dort ist `--force` harmlos, es betrifft nur
      # die Aufräumregel selbst.
      #
      # `continue-on-error`, weil der Schritt beim allerersten Lauf ins Leere
      # greift: das Repository der Region entsteht erst mit dem ersten
      # Deploy. Dann setzt ihn der nächste Lauf.
      - name: Aufräumregel für Container-Abbilder
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          npx --yes firebase-tools@15 functions:artifacts:setpolicy \
            --project "$PROJECT_ID" \
            --location europe-west3 \
            --days 3 \
            --force \
            --non-interactive

      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          # Kein --force: der Schalter würde Functions, die im Code fehlen,
          # ohne Rückfrage aus der Produktion löschen. Steht eine Löschung an,
          # soll der Deploy lieber scheitern und jemand hinsehen.
          npx --yes firebase-tools@15 deploy \
            --only functions \
            --project "$PROJECT_ID" \
            --non-interactive

      - name: Was wurde deployt
        run: |
          if [ "${{ inputs.ki_erfassung }}" = "true" ]; then
            echo "Mit KI-Spracherfassung (voiceExtract)."
          else
            echo "Ohne KI-Spracherfassung. syncUserClaims, exportCompanyData"
            echo "und die beiden Benachrichtigungs-Trigger sind live."
            echo "Zum Einschalten: diesen Workflow von Hand starten und"
            echo "'KI-Spracherfassung mitdeployen' ankreuzen."
          fi

      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"

      - name: Was jetzt gilt
        run: |
          echo "syncUserClaims setzt ab sofort companyId und Rolle für jeden"
          echo "neu angelegten Benutzer. Bereits vorhandene Konten bekommen ihre"
          echo "Berechtigungen erst beim nächsten Speichern in der"
          echo "Benutzerverwaltung — einmal öffnen und speichern genügt."
