name: Durchklick

# DIE APP IM ECHTEN BROWSER, auf den sieben Wegen, bei denen ein Fehler Geld
# oder Arbeitszeit kostet: Zeit buchen, Material anfordern, Schein
# unterschreiben, Rechnung stellen, Katalog einspielen — der allererste
# Besuch, an dem alle anderen hängen, und die Anmeldung mit Benutzername. Die Anmeldung steht nicht daneben:
# jeder Weg beginnt damit, und zwar über die Maske, nicht über eine
# untergeschobene Sitzung.
#
# WARUM ES DIESEN AUFTRAG NEBEN DEN ANDEREN GIBT. „Typen, Lint und Tests"
# prüft Bausteine mit nachgebauter Umgebung, „Migrationen von null an" die
# Datenschicht gegen die echte Datenbank. Beide sind blind für die Naht
# dazwischen: eine Ansicht, die eine Funktion ruft, die es nicht mehr gibt;
# ein Knopf, der nach einem Umbau ins Leere zeigt. Genau diese Sorte hat der
# Rauchtest des Betriebs gefunden — drei Stück an einem Nachmittag, keinen
# davon hat eine Prüfung vorher gesehen.
#
# NUR AUF PULL REQUESTS, nicht auf jedem Push nach main: der Lauf braucht
# einen ganzen Supabase-Stapel und einen Browser. Was hier rot wird, muss vor
# dem Merge grün sein — danach ist es zu spät.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'supabase/**'
      - 'tests/durchklick/**'
      - 'tests/links/**'
      - 'tools/vorschau/**'
      - 'tools/testbestand/**'
      - 'playwright.config.ts'
      - 'playwright.links.config.ts'
      # Die Inhaltsregel: ein neuer Kopf, eine neue Seite oder Bibliothek kann
      # etwas brauchen, das die Regel sperrt — live wäre das eine weiße Seite.
      - 'tests/csp/**'
      - 'playwright.csp.config.ts'
      - 'firebase.json'
      - 'vite.config.ts'
      # Ein Bibliotheks-Update ändert keine Zeile in src/ und kann trotzdem
      # jeden Weg brechen (React Router, jsPDF) — genau dann muss er laufen.
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/durchklick.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durchklick-${{ github.ref }}
  cancel-in-progress: true

# Node 22 aus demselben Grund wie bei den Migrationen: `supabase-js` baut im
# Konstruktor einen Realtime-Client und verlangt dafür ein globales
# `WebSocket`, das es erst ab 22 gibt.
env:
  NODE_VERSION: '22'

jobs:
  # IN VIER TEILEN NEBENEINANDER (16.11.2026). Ein Auftrag mit einem Browser
  # nacheinander brauchte für 317 Wege 45 Minuten, dazu Links und
  # Inhaltsregel — rot wurde ein PR erst nach einer Dreiviertelstunde. Jeder
  # Teil hat seinen eigenen Stapel und seinen eigenen Aufbau; die Wege sind
  # dieselben, nur auf vier Rechner verteilt (`--shard`, je Datei). Dass ein
  # Weg dabei auf einen anderen angewiesen wäre, darf nicht sein: jeder legt
  # an, was er braucht.
  durchklicken:
    name: Durchklick ${{ matrix.teil }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2, 3, 4]
    steps:
      # DIE PORTS DES STAPELS VOR DEM ERSTEN NETZZUGRIFF RESERVIEREN (13.11.2026).
      # 54320–54329 liegen im Bereich, aus dem Linux Ports für ausgehende
      # Verbindungen vergibt (32768–60999). Beim Holen der Images öffnet
      # `supabase start` über hundert Verbindungen; hielt eine davon gerade
      # 54322, scheiterte der Start mit „address already in use“ — zweimal
      # hintereinander auf `main` (Lauf 43490981238), ohne dass eine Prüfung lief.
      - name: Ports des Stapels reservieren
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Feste Fassung statt `latest`: `latest` fragt die GitHub-API ohne
      # Schlüssel, und deren Ratenlimit liess am 18.10.2026 das Einspielen
      # zweimal scheitern, bevor es begann. Dieselbe Fassung wie lokal.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      # Vor dem Start: `supabase start` kopiert die Functions in den
      # Container, es bindet sie nicht ein.
      - name: Gemeinsame Regeln übernehmen
        run: npm run gemeinsames

      - name: Stapel hochfahren
        run: supabase start

      # Scheitert der Start dennoch, steht hier, wer die Ports hält — Nachweis statt Vermutung.
      - name: Wer hält die Ports des Stapels?
        if: failure()
        run: sudo ss -tanp | grep -E ':543(2[0-9])\b' || echo 'keiner'

      # Chromium für alle Wege, dazu WebKit (Safari) für die Wege des
      # Monteurs am Telefon (Nachtest 01.10.2026, Paket E) — Firefox nicht:
      # kein Gerät der Monteure läuft damit.
      - name: Browser holen
        run: npx playwright install --with-deps chromium webkit

      - name: Durchklick
        run: npm run durchklick -- --shard=${{ matrix.teil }}/4

      # Bilder und Spuren NUR BEI ROT. Sie sind der Unterschied zwischen
      # „irgendein Knopf fehlte" und einer Antwort in zwei Minuten.
      - name: Bilder und Spuren sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: durchklick-spuren-${{ matrix.teil }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Jede Seite jeder Rolle unter der DURCHGESETZTEN Inhaltsregel, am
  # Schreibtisch und am Telefon (Testbericht Runde 6, 8.4 und Hinweis 13).
  # Gegen den fertigen Bau mit den Kopfzeilen aus `firebase.json` — der
  # Entwicklungsserver des Durchklicks schickt keine Regel. Braucht den
  # Stapel (derselbe Aufbau), aber keinen der Durchklick-Teile.
  inhaltsregel:
    name: Inhaltsregel je Rolle
    runs-on: ubuntu-latest
    steps:
      - name: Ports des Stapels reservieren
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Gemeinsame Regeln übernehmen
        run: npm run gemeinsames
      - name: Stapel hochfahren
        run: supabase start
      - name: Wer hält die Ports des Stapels?
        if: failure()
        run: sudo ss -tanp | grep -E ':543(2[0-9])\b' || echo 'keiner'
      - name: Browser holen
        run: npx playwright install --with-deps chromium webkit
      - name: Inhaltsregel je Rolle
        run: npm run pruefen:inhaltsregel
      - name: Bilder und Spuren sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inhaltsregel-spuren
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Jeder Link führt dorthin, wo die Rolle hin darf (offene Punkte C1).
  # Läuft gegen die Vorschau mit Beispieldaten, nicht gegen den Stapel —
  # deshalb ohne Supabase und neben den anderen.
  links:
    name: Links je Rolle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Browser holen
        run: npx playwright install --with-deps chromium webkit
      - name: Links je Rolle
        run: npm run pruefen:links
      - name: Bilder und Spuren sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: links-spuren
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # DER NAME BLEIBT, obwohl es inzwischen sieben Wege sind: unter ihm kann
  # die Prüfung als Pflicht für den Merge hinterlegt sein, und ein neuer
  # Name hiesse eine Pflichtprüfung, die nie mehr berichtet. Seit der
  # Aufteilung (16.11.2026) sammelt er nur: grün genau dann, wenn alle vier
  # Teile, die Inhaltsregel und die Links grün sind — auch übersprungen oder
  # abgebrochen zählt als rot.
  gesamt:
    name: Die sechs Wege im Browser
    runs-on: ubuntu-latest
    needs: [durchklicken, inhaltsregel, links]
    if: always()
    steps:
      - name: Alle Teile grün?
        run: |
          echo "Durchklick: ${{ needs.durchklicken.result }} · Inhaltsregel: ${{ needs.inhaltsregel.result }} · Links: ${{ needs.links.result }}"
          test "${{ needs.durchklicken.result }}" = success
          test "${{ needs.inhaltsregel.result }}" = success
          test "${{ needs.links.result }}" = success
