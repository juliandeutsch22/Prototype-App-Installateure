name: Supabase-Migrationen

# WAS HIER LÄUFT UND WAS NICHT.
#
# Auf jedem Pull Request: die Migrationen werden gegen eine FRISCHE lokale
# Datenbank gespielt und die Prüfungen laufen dagegen. Das beantwortet die
# Frage, die ein Blick in die Datei nicht beantwortet — laufen sie in dieser
# Reihenfolge, von null an, ohne die Hand, die beim Schreiben nachgeholfen hat.
#
# Auf `main`: dieselben Migrationen wandern ins echte Projekt.
#
# WARUM DIE PRÜFUNG VOR DEM EINSPIELEN STEHT und nicht daneben: eine
# Migration, die einmal im Projekt liegt, ist dort. Es gibt kein Zurück durch
# ein `git revert` — die Tabelle ist geändert, die Daten sind es womöglich
# auch. Was ins Projekt geht, muss vorher von null an gelaufen sein.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-migrationen.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'tests/supabase/**'
      - 'src/lib/db/**'
      - '.github/workflows/supabase-migrationen.yml'
  workflow_dispatch:

permissions:
  contents: read

# Zwei gleichzeitige Läufe gegen dasselbe Projekt würden sich überholen, und
# bei Migrationen heisst „überholen" nicht „der zweite gewinnt", sondern
# „niemand weiss mehr, welcher Stand drin ist". Deshalb kein Abbruch auf main.
concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Node 22, nicht 20: `@supabase/supabase-js` baut in seinem Konstruktor einen
# Realtime-Client, und der verlangt ein globales `WebSocket`. Das gibt es in
# Node erst ab 22. Unter 20 scheitert schon `createClient` in
# `tests/supabase/helfer.ts` — vor der ersten Prüfung, mit einer Meldung, die
# nach einem Fehler in den Migrationen aussieht und keiner ist.
env:
  NODE_VERSION: '22'

jobs:
  pruefen:
    name: Migrationen von null an, mit allen Prüfungen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Die gemeinsamen Regeln müssen VOR dem Start dort liegen: `supabase
      # start` kopiert die Functions in den Container, es bindet sie nicht ein.
      - name: Gemeinsame Regeln übernehmen
        run: npm run gemeinsames

      # `supabase start` spielt alles in `supabase/migrations/` der Reihe nach
      # ein. Scheitert eine, scheitert der Start — und zwar hier und nicht im
      # Projekt.
      - name: Stapel hochfahren
        run: supabase start

      - name: Prüfungen gegen die echte Datenbank
        run: npm run supabase:test

  einspielen:
    name: Ins Projekt einspielen
    needs: pruefen
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Mit dem Projekt verbinden
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # ZUERST ZEIGEN, DANN TUN. `db diff --linked` sagt, was sich zwischen
      # Projekt und Migrationen unterscheidet; das steht danach im Protokoll
      # und ist die einzige Aufzeichnung darüber, was dieser Lauf verändert
      # hat. Ohne sie bliebe nach einem missglückten Einspielen nur Raten.
      - name: Was sich ändern würde
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db diff --linked

      - name: Migrationen einspielen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --include-all

      # NACH den Migrationen, nicht davor. Die Function ruft
      # `public.betrieb_anlegen` auf; stünde sie vor ihrer eigenen
      # Datenbankfunktion im Projekt, wäre das Zeitfenster dazwischen eine
      # Function, die bei jedem Aufruf scheitert.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Gemeinsame Regeln übernehmen
        run: npm run gemeinsames

      - name: Edge Functions ausliefern
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
