name: Test und Deploy

# Jeder Pull Request wird geprüft; deployed wird ausschließlich, was auf main
# liegt. Der Deploy hängt am Job "test": ist auch nur eine Regel oder ein
# Zeitberechnungs-Test rot, geht nichts live. Eine kaputte Zeiterfassung im
# Betrieb kostet mehr, als ein paar Minuten CI je sparen.
on:
  push:
    branches: [main]
  pull_request:
  # Erlaubt einen Deploy von Hand über "Actions" > "Run workflow".
  workflow_dispatch:

permissions:
  contents: read

# Zwei gleichzeitige Deploys auf dieselbe Umgebung würden sich überholen.
# Läuft schon einer, wartet der neue; PR-Prüfungen brechen dagegen ab, sobald
# ein neuer Commit kommt.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Typen, Lint und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Der Firestore-Emulator ist ein Java-Programm. Ohne JDK laufen die
      # Security-Rules-Tests nicht. Mindestens 21: firebase-tools bricht seit
      # Version 15 mit älteren JDKs ab ("no longer supports Java version
      # before 21").
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Typprüfung
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit-Tests
        run: npm test

      # Zwei Fragen, ein Emulator, der nur für diesen Befehl startet:
      #
      #  1. Regeln — kommt Firma B an ein Dokument von Firma A? (Nein.)
      #  2. Abfragen — läuft das, was die App tatsächlich absetzt, für die
      #     Rolle, die es absetzt?
      #
      # Die zweite Frage beantwortet kein Komponententest: dort ist jeder
      # Datenbankzugriff ersetzt, und eine Abfrage, die an den Regeln
      # scheitert, sieht dann aus wie ein Erfolg mit leerem Ergebnis.
      - name: Regeln und Abfragen gegen den Emulator
        run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-ci "npm run rules:test"

  deploy:
    name: Auf Firebase Hosting veröffentlichen
    needs: test
    # Ausschließlich main geht live — auch bei einem Deploy von Hand. Sonst
    # könnte ein halbfertiger Zweig versehentlich beim Kunden landen.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Fehlt ein Wert, entsteht sonst ein Build, der erst im Browser des
      # Kunden mit "Firebase-Konfiguration fehlt" abbricht. Lieber hier laut
      # scheitern als still etwas Kaputtes veröffentlichen.
      # Geprüft werden ALLE sechs Werte, nicht nur die, ohne die der Build
      # abbricht. Fehlte etwa die authDomain, liefe der Deploy durch und die
      # Anmeldung wäre beim Kunden kaputt — die Lücke fiele erst beim ersten
      # Anmeldeversuch auf.
      - name: Zugangsdaten vollständig?
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          missing=""
          [ -n "$SERVICE_ACCOUNT" ] || missing="$missing FIREBASE_SERVICE_ACCOUNT"
          [ -n "$API_KEY" ]         || missing="$missing VITE_FIREBASE_API_KEY"
          [ -n "$AUTH_DOMAIN" ]     || missing="$missing VITE_FIREBASE_AUTH_DOMAIN"
          [ -n "$PROJECT_ID" ]      || missing="$missing VITE_FIREBASE_PROJECT_ID"
          [ -n "$STORAGE_BUCKET" ]  || missing="$missing VITE_FIREBASE_STORAGE_BUCKET"
          [ -n "$SENDER_ID" ]       || missing="$missing VITE_FIREBASE_MESSAGING_SENDER_ID"
          [ -n "$APP_ID" ]          || missing="$missing VITE_FIREBASE_APP_ID"
          if [ -n "$missing" ]; then
            echo "::error::Diese Repository-Secrets fehlen:$missing"
            echo "Anzulegen unter: Settings > Secrets and variables > Actions > New repository secret."
            echo "Siehe README, Abschnitt 'Deployment'."
            exit 1
          fi

      - run: npm ci

      # Vite backt die Konfiguration beim Bauen in das Bundle. Sie muss also
      # HIER stehen, nicht erst beim Deploy.
      - name: Bauen
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Ohne diesen Schluessel laeuft die App normal, nur ohne Push —
          # deshalb kein Abbruch in der Vorabpruefung, sondern optional.
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_FUNCTIONS_REGION: ${{ vars.VITE_FUNCTIONS_REGION || 'europe-west3' }}
          VITE_PORTAL_NAME: ${{ vars.VITE_PORTAL_NAME || 'Perl Installationen' }}
          # Im Produktivbuild niemals gegen die lokalen Emulatoren zeigen.
          VITE_USE_EMULATORS: 'false'
          # SUPABASE — ab hier liegt beides im Bundle, benutzt wird aber nur
          # eines. Welches, entscheidet `VITE_DATENQUELLE`: alles ausser
          # `postgres` heisst Firestore, und die Variable ist bis zum
          # Umschalten in Stufe 8 nicht gesetzt.
          #
          # Sie stehen trotzdem schon hier. Der Umzug soll an EINER Stelle
          # umgelegt werden — an einer Variablen, nicht an einem Deploy, bei
          # dem gleichzeitig drei neue Werte zum ersten Mal mitkommen. Wenn
          # der Schalter fällt, ist das hier längst erprobt.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DATENQUELLE: ${{ vars.VITE_DATENQUELLE || 'firestore' }}
        run: npm run build

      # Der Schlüssel landet außerhalb des Arbeitsverzeichnisses, damit er
      # weder in den Build noch versehentlich in einen Commit gerät.
      - name: Dienstkonto bereitstellen
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          chmod 600 "$RUNNER_TEMP/service-account.json"

      # Hosting UND Firestore-Regeln zusammen: eine neue Oberfläche ohne die
      # passenden Regeln wäre entweder gesperrt oder – schlimmer – offen.
      # Indizes gehören dazu, sonst laufen Abfragen produktiv ins Leere, die
      # lokal gegen den Emulator noch funktioniert haben.
      #
      # STORAGE-REGELN AUS DEMSELBEN GRUND, seit die Handwerksscheine Fotos
      # tragen. Fehlten sie hier, gälten in Produktion die Voreinstellungen —
      # und die sperren jeden Zugriff vom Gerät. Das Aufnehmen eines Fotos
      # schlüge dann fehl, und zwar erst beim Monteur auf der Baustelle.
      #
      # VORAUSSETZUNG, die nur EINMAL von Hand geht: der Standard-Bucket muss
      # in der Firebase-Konsole unter „Storage" angelegt sein. Ohne ihn hat
      # dieser Schritt kein Ziel und bricht ab — mit einer Meldung, die genau
      # das sagt.
      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          npx --yes firebase-tools@15 deploy \
            --only hosting,firestore:rules,firestore:indexes,storage \
            --project "$PROJECT_ID" \
            --non-interactive \
            --message "${GITHUB_SHA::7} von ${GITHUB_ACTOR}"

      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
