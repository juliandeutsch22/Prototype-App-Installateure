name: Test und Deploy

# Jeder Pull Request wird geprüft; deployed wird ausschließlich, was auf main
# liegt. Der Deploy hängt am Job "test": ist auch nur eine Regel oder ein
# Zeitberechnungs-Test rot, geht nichts live. Eine kaputte Zeiterfassung im
# Betrieb kostet mehr, als ein paar Minuten CI je sparen.
on:
  push:
    branches: [main]
  pull_request:
  # Erlaubt einen Deploy von Hand über "Actions" > "Run workflow".
  workflow_dispatch:

permissions:
  contents: read

# Zwei gleichzeitige Deploys auf dieselbe Umgebung würden sich überholen.
# Läuft schon einer, wartet der neue; PR-Prüfungen brechen dagegen ab, sobald
# ein neuer Commit kommt.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Typen, Lint und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typprüfung
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit-Tests
        run: npm test

      # DIESELBEN ZWEI FRAGEN STELLT JETZT DER MIGRATIONS-WORKFLOW.
      #
      # Hier lief bis zum 19.09.2026 ein Firestore-Emulator gegen
      # `firestore.rules.test.ts` und `abfragen.smoke.test.ts`. Beide sind mit
      # Firestore gefallen; ihre Fragen nicht:
      #
      #  1. Zeilenschutz — kommt Betrieb B an eine Zeile von Betrieb A? (Nein.)
      #  2. Abfragen — läuft das, was die App tatsächlich absetzt, für die
      #     Rolle, die es absetzt?
      #
      # Beides beantwortet `.github/workflows/supabase-migrationen.yml` gegen
      # eine echte Postgres-Datenbank, von null aufgebaut. Dass beim Umzug
      # keine der 155 Regelprüfungen verlorenging, hält
      # `tests/supabase/vollstaendigkeit.test.ts` maschinell fest.

  deploy:
    name: Auf Firebase Hosting veröffentlichen
    needs: test
    # Ausschließlich main geht live — auch bei einem Deploy von Hand. Sonst
    # könnte ein halbfertiger Zweig versehentlich beim Kunden landen.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # LAUT SCHEITERN STATT STILL ETWAS KAPUTTES VERÖFFENTLICHEN. Geprüft
      # wird, was die App zum Laufen und der Deploy zum Stattfinden braucht —
      # und das ist seit dem Abbau von Firestore etwas anderes als vorher.
      #
      # PFLICHT sind die beiden Supabase-Werte: ohne sie startet die App gar
      # nicht. Dazu der Firebase-Dienstschlüssel und die Projektkennung —
      # ohne beides kann der Deploy selbst nicht stattfinden. Die Kennung
      # steht im selben Secret wie für den Build, wird hier aber aus dem
      # anderen Grund verlangt.
      #
      # DIE ÜBRIGEN FÜNF FIREBASE-WEB-WERTE SIND ES NICHT MEHR. Sie richten
      # nur noch die Push-Anmeldung ein; fehlen sie, läuft die App vollständig
      # und es gibt keine Meldungen aufs Telefon. Den Deploy dafür abzubrechen
      # hiesse, eine Nebenfunktion über die Hauptsache zu stellen.
      - name: Zugangsdaten vollständig?
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -n "$SERVICE_ACCOUNT" ] || missing="$missing FIREBASE_SERVICE_ACCOUNT"
          [ -n "$PROJECT_ID" ]      || missing="$missing VITE_FIREBASE_PROJECT_ID"
          [ -n "$SUPABASE_URL" ]    || missing="$missing VITE_SUPABASE_URL"
          [ -n "$SUPABASE_ANON" ]   || missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Diese Repository-Secrets fehlen:$missing"
            echo "Anzulegen unter: Settings > Secrets and variables > Actions > New repository secret."
            echo "Siehe README, Abschnitt 'Deployment'."
            exit 1
          fi

      - run: npm ci

      # Vite backt die Konfiguration beim Bauen in das Bundle. Sie muss also
      # HIER stehen, nicht erst beim Deploy.
      - name: Bauen
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Ohne diesen Schluessel laeuft die App normal, nur ohne Push —
          # deshalb kein Abbruch in der Vorabpruefung, sondern optional.
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          # DIE RÜCKFALLTÜR IST AM 19.09.2026 ZUGEGANGEN.
          #
          # Hier stand `VITE_DATENQUELLE`: alles ausser `postgres` baute die
          # Firestore-Seite. Das war der Rückweg für Stufe 8 — ein Umzug ohne
          # Rückweg wäre eine Wette gewesen.
          #
          # Mit Stufe 9 ist die Firestore-Hälfte ausgebaut, und damit ist die
          # Variable eine Zusage, die niemand mehr einlösen könnte. Sie steht
          # deshalb nicht mehr da: ein Schalter, der nichts mehr schaltet, ist
          # gefährlicher als keiner.
          #
          # OHNE DIE BEIDEN GEHEIMNISSE startet die App nicht still falsch,
          # sondern gar nicht: `supabaseClient()` wirft mit einer Meldung, die
          # sagt, was fehlt.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # Der Schlüssel landet außerhalb des Arbeitsverzeichnisses, damit er
      # weder in den Build noch versehentlich in einen Commit gerät.
      - name: Dienstkonto bereitstellen
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          chmod 600 "$RUNNER_TEMP/service-account.json"

      # NUR NOCH HOSTING. Regeln, Indizes und Speicherplatz liegen seit dem
      # 19.09.2026 bei Supabase; sie gehen über
      # `.github/workflows/supabase-migrationen.yml` live.
      #
      # DASS BEIDES GETRENNT LÄUFT, IST EINE ZUSAGE MIT KANTE: eine neue
      # Oberfläche kann jetzt vor ihrer Migration ankommen. Deshalb gilt die
      # Reihenfolge — erst die Migration, dann die Oberfläche —, und deshalb
      # verträgt jede Migration den alten Stand der App. Wer eine Spalte
      # umbenennt, legt sie in zwei Schritten um.
      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          npx --yes firebase-tools@15 deploy \
            --only hosting \
            --project "$PROJECT_ID" \
            --non-interactive \
            --message "${GITHUB_SHA::7} von ${GITHUB_ACTOR}"

      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
