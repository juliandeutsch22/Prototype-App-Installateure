<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      DIE FARBE DES STATUSBALKENS auf dem Startbildschirm — und sie ist nicht
      dieselbe wie die dunkelste Ecke der Kopfleiste.

      Vorher stand hier `#0a2030`, der Anfangspunkt von `--grad-brand`. Rein
      rechnerisch passte das: an der oberen linken Ecke IST die Kopfleiste
      dieses Blau. Nur sieht das Auge nicht die Ecke, sondern die Fläche, und
      die läuft über `#0f4552` nach `#107a8c`. Der Balken stand damit als
      dunkler Riegel über einer türkisen Leiste.

      `#0f4552` ist der mittlere Halt desselben Verlaufs und zugleich der
      Grund des App-Zeichens. Er schliesst nach beiden Seiten an.

      NICHT `black-translucent`: das liesse den Inhalt unter den Balken laufen
      und die Kopfleiste ihren eigenen Verlauf dorthin ziehen — schöner, aber
      hier falsch. Die Kopfleiste ist nicht fixiert, sie scrollt weg; danach
      stünde die weisse Systemschrift auf hellem Grund.
    -->
    <meta name="theme-color" content="#0f4552" />
    <!--
      DAS FAVICON IST EIGENS FÜR KLEINE GRÖSSEN GEZEICHNET, nicht verkleinert.
      Beim Senklot verschwindet die Schnur bei 16 px zu einem Grauschleier und
      die Öse zu einem Pixel Matsch; was dort trägt, ist der Körper allein —
      er sitzt deshalb grösser im Feld und ohne Schnur (siehe
      `marke/favicon.svg` gegenüber `marke/icon.svg`).

      Die 16er-Fassung steht ausdrücklich da, statt sie den Browser aus der
      32er rechnen zu lassen: genau dafür gibt es die zweite Zeichnung.
    -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Perl Zeiterfassung</title>
    <!--
      Hinweis: Das früher hier injizierte Kaspersky-Script
      (ff.kis.v2.scr.kaspersky-labs.com) wurde entfernt — es gehörte nicht
      zur App. Tailwind läuft jetzt als Build-Dependency, nicht via CDN.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
