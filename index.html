<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      DIE FARBE DES STATUSBALKENS auf dem Startbildschirm.

      `#0f4552` ist `--brand-fixed`: die Farbe der Kopfleiste, die Farbe des
      Zeichens, die Farbe des Strichs unter jeder Überschrift. Solange die
      Kopfleiste einen Verlauf trug, war das eine Näherung — der Balken sass
      über einer Fläche, die von `#0a2030` nach `#107a8c` lief, und passte
      nur an einer Stelle. Seit sie flach ist, ist es dieselbe Farbe.

      NICHT `black-translucent`: das liesse den Inhalt unter den Balken
      laufen — schöner, aber hier falsch. Die Kopfleiste ist nicht fixiert,
      sie scrollt weg; danach stünde die weisse Systemschrift auf hellem
      Grund.
    -->
    <meta name="theme-color" content="#0f4552" />
    <!--
      DAS FAVICON IST EIGENS FÜR KLEINE GRÖSSEN GEZEICHNET, nicht verkleinert.
      Beim Senklot verschwindet die Schnur bei 16 px zu einem Grauschleier und
      die Öse zu einem Pixel Matsch; was dort trägt, ist der Körper allein —
      er sitzt deshalb grösser im Feld und ohne Schnur (siehe
      `marke/favicon.svg` gegenüber `marke/icon.svg`).

      Die 16er-Fassung steht ausdrücklich da, statt sie den Browser aus der
      32er rechnen zu lassen: genau dafür gibt es die zweite Zeichnung.
    -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Senklot</title>
    <!--
      Hinweis: Das früher hier injizierte Kaspersky-Script
      (ff.kis.v2.scr.kaspersky-labs.com) wurde entfernt — es gehörte nicht
      zur App. Tailwind läuft jetzt als Build-Dependency, nicht via CDN.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
